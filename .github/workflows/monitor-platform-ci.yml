name: Monitor Platform CI

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number in quarkusio/quarkus-platform'
        required: true
      issue-number:
        description: 'Release issue number to post comments to'
        required: true
      message-if-success:
        description: 'Message to post if CI passes'
        required: true
      message-if-failure:
        description: 'Message to post if CI fails after all retries'
        required: true
      initial-delay:
        description: 'Initial delay in minutes before first check'
        required: true
      poll-delay:
        description: 'Delay in minutes between checks'
        required: true
      poll-iterations:
        description: 'Maximum number of polling iterations'
        required: true

permissions:
  issues: write

defaults:
  run:
    shell: bash

concurrency:
  group: issue-${{ github.event.inputs.issue-number }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor Platform CI
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          MESSAGE_IF_SUCCESS: ${{ github.event.inputs.message-if-success }}
          MESSAGE_IF_FAILURE: ${{ github.event.inputs.message-if-failure }}
        run: |
          PR_NUMBER="${{ github.event.inputs.pr-number }}"
          ISSUE_NUMBER="${{ github.event.inputs.issue-number }}"
          INITIAL_DELAY="${{ github.event.inputs.initial-delay }}"
          POLL_DELAY="${{ github.event.inputs.poll-delay }}"
          POLL_ITERATIONS="${{ github.event.inputs.poll-iterations }}"

          echo "Monitoring CI for quarkusio/quarkus-platform PR #${PR_NUMBER}"
          echo "Will report to issue #${ISSUE_NUMBER}"
          echo "Initial delay: ${INITIAL_DELAY} minutes, poll delay: ${POLL_DELAY} minutes, max iterations: ${POLL_ITERATIONS}"

          echo "Waiting ${INITIAL_DELAY} minutes before first check..."
          sleep $(( INITIAL_DELAY * 60 ))

          for i in $(seq 1 ${POLL_ITERATIONS}); do
            echo "--- Check iteration ${i}/${POLL_ITERATIONS} ---"

            CHECKS_JSON=$(gh pr checks ${PR_NUMBER} --repo quarkusio/quarkus-platform --json bucket 2>&1) || true

            if ! echo "${CHECKS_JSON}" | python3 -c "import json, sys; json.load(sys.stdin)" 2>/dev/null; then
              echo "No checks found yet or error fetching checks, waiting..."
              sleep $(( POLL_DELAY * 60 ))
              continue
            fi

            PENDING=$(echo "${CHECKS_JSON}" | python3 -c "import json, sys; data=json.load(sys.stdin); print(sum(1 for d in data if d['bucket'] == 'pending'))")
            FAILED=$(echo "${CHECKS_JSON}" | python3 -c "import json, sys; data=json.load(sys.stdin); print(sum(1 for d in data if d['bucket'] == 'fail'))")
            PASSED=$(echo "${CHECKS_JSON}" | python3 -c "import json, sys; data=json.load(sys.stdin); print(sum(1 for d in data if d['bucket'] in ('pass', 'skipping')))")
            TOTAL=$((PENDING + FAILED + PASSED))

            echo "Status: ${PASSED} passed/skipped, ${FAILED} failed, ${PENDING} pending (total: ${TOTAL})"

            if [ "${TOTAL}" -eq 0 ]; then
              echo "No check results found yet, waiting..."
              sleep $(( POLL_DELAY * 60 ))
              continue
            fi

            if [ "${PENDING}" -eq 0 ] && [ "${FAILED}" -eq 0 ] && [ "${PASSED}" -gt 0 ]; then
              echo "All checks passed!"
              gh issue comment ${ISSUE_NUMBER} --repo "${{ github.repository }}" --body "${MESSAGE_IF_SUCCESS}"
              exit 0
            fi

            if [ "${PENDING}" -eq 0 ] && [ "${FAILED}" -gt 0 ]; then
              echo "Some checks failed, giving up and requesting manual intervention"
              gh issue comment ${ISSUE_NUMBER} --repo "${{ github.repository }}" --body "${MESSAGE_IF_FAILURE}"
              exit 1
            fi

            if [ "${i}" -lt "${POLL_ITERATIONS}" ]; then
              echo "Waiting ${POLL_DELAY} minutes before next check..."
              sleep $(( POLL_DELAY * 60 ))
            fi
          done

          echo "Polling iterations exhausted"
          gh issue comment ${ISSUE_NUMBER} --repo "${{ github.repository }}" --body "${{ github.event.inputs.message-if-failure }}"
          exit 1
